[variables]
NIXPACKS_PHP_ROOT_DIR = "public"

[phases.install]
cmds = [
    "npm install --no-audit --no-fund",
    "composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
